# Dependabot keeps the workflows' actions and each module's dependencies
# current. A module's go.mod requires the versions it is tested against,
# and Go builds a customer's program with the highest version any module
# requires, so these are the oldest versions a customer can end up with.
#
# The gRPC module builds against the client in ../client, so a dependency
# the two share is updated in both at once: one pull request per
# dependency, across both directories.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directories:
      - /client
      - /grpc
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
        group-by: dependency-name
