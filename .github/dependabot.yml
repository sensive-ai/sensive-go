# Dependabot keeps the workflows' actions current.
#
# It leaves the modules' dependencies alone. A library's go.mod is a floor,
# not a pin: Go builds a customer's program with the highest version any
# module in it requires, so every version the SDK requires is one its
# customers are made to take. Each go.mod requires no newer version than
# the SDK needs, and CI tests those versions (the floors job) and the
# newest (the latest job). A floor is raised by hand, when the SDK needs
# something newer, and only in a minor release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
